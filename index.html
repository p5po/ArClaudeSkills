<head>

    <style>
        :root {
            /* الألوان الأساسية للوضع الفاتح */
            --primary: #C15F3C;
            --bg: #F4F3EE;
            --card-bg: #FFFFFF;
            --border-color: #B1ADA1;
            --text-main: #222222;
            --text-muted: #555555;
            --stats-bg: rgba(177, 173, 161, 0.15);
            --code-bg: #2b2b2b;
            --code-text: #f8f8f2;
        }

        /* متغيرات الوضع الداكن (Dark Mode) */
        [data-theme="dark"] {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --stats-bg: rgba(255, 255, 255, 0.05);
            --code-bg: #000000;
            --code-text: #d4d4d4;
        }
        
        /* إعادة تعيين أساسية لمنع الـ Scroll العرضي */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden; /* يمنع الحركة يمين ويسار بالغلط */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px; 
            background-color: var(--card-bg);
            border-bottom: 3px solid var(--border-color);
            position: sticky; 
            top: 0;
            z-index: 100;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        
        .logo-area { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }
        .logo-area h1 { 
            margin: 0; 
            color: var(--primary); 
            font-size: 22px; 
        }
        
        .logo-image { 
            height: 55px; 
            width: auto;
            object-fit: contain;
        }

        /* زر الوضع الداكن */
        .theme-toggle {
            background: none;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.2s ease;
            margin-right: 15px;
        }
        .theme-toggle:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .header-actions {
            display: flex;
            align-items: center;
        }

        main { 
            width: 100%;
            max-width: 900px; 
            margin: 30px auto; 
            padding: 0 20px;
            flex: 1; /* لجعل المحتوى يتمدد ويدفع الفوتر للأسفل */
        }
        
        .search-container { 
            margin-bottom: 30px; 
            text-align: center; 
        }
        .search-bar {
            width: 100%;
            max-width: 600px;
            padding: 14px 20px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text-main);
            box-shadow: 3px 3px 0px var(--border-color);
            outline: none;
            transition: all 0.2s ease;
        }
        .search-bar:focus { 
            border-color: var(--primary);
            box-shadow: 3px 3px 0px var(--primary); 
        }
        .search-bar::placeholder {
            color: var(--text-muted);
        }

        .skills-grid { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }

        .skill-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            box-shadow: 4px 4px 0px var(--border-color);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.3s ease, border-color 0.3s ease;
            overflow: hidden;
            width: 100%;
        }
        .skill-card:active { 
            transform: translate(2px, 2px); 
            box-shadow: 2px 2px 0px var(--border-color); 
        }
        
        .skill-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        /* محاذاة صارمة لليمين */
        .skill-title-group { 
            flex: 1 1 100%; 
            min-width: 250px; 
            text-align: right;
        }
        .skill-title-group h3 { 
            margin: 0 0 4px 0; 
            color: var(--text-main); 
            font-size: 17px;
        }
        .skill-title-group p { 
            margin: 0; 
            color: var(--text-muted); 
            font-size: 13px;
            line-height: 1.4;
        }
        
        .skill-actions { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            flex-wrap: wrap; 
        }
        
        .github-stats {
            background-color: var(--stats-bg);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: bold;
            min-width: 65px;
            justify-content: center;
        }
        .github-stats svg { width: 14px; height: 14px; fill: currentColor; }

        .btn {
            padding: 8px 14px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn svg { width: 14px; height: 14px; fill: currentColor; }
        
        .btn-copy { background-color: var(--primary); color: white; border-color: var(--primary); }
        .btn-copy:hover { background-color: #a85132; border-color: #a85132; }
        
        .btn-download { background-color: var(--card-bg); color: var(--text-main); }
        .btn-download:hover { background-color: var(--bg); }
        
        .btn-github { background-color: #24292e; color: white; border-color: #24292e; }
        .btn-github:hover { background-color: #1b1f23; border-color: #1b1f23; }

        .skill-details {
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.4s ease, margin-top 0.4s ease;
        }
        .skill-card.active .skill-details {
            max-height: 5000px;
            opacity: 1;
            margin-top: 15px; 
            border-top: 1px dashed var(--border-color); 
            padding-top: 15px;
        }

        pre {
            background-color: var(--code-bg);
            color: var(--code-text);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            direction: rtl;
            text-align: right;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13.5px;
            line-height: 1.5;
            white-space: pre-wrap;
            margin: 0; 
            border: 1px solid var(--border-color);
        }

        /* ========================================= */
        /* تنسيقات الفوتر (حقوق النشر) الجديدة       */
        /* ========================================= */
        footer {
            background-color: var(--card-bg);
            border-top: 3px solid var(--border-color);
            padding: 24px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14.5px;
            font-weight: 500;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
            margin-top: 40px;
        }
        
        footer p {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s ease, transform 0.2s ease;
            display: inline-block;
        }

        footer a:hover {
            color: #a85132;
            text-decoration: underline;
            transform: translateY(-2px);
        }

        /* ========================================= */
        /* استجابة الجوال (Mobile Responsiveness)    */
        /* ========================================= */
        @media (min-width: 769px) {
            .skill-title-group { flex: 1; }
            .skill-actions { flex: 0 0 auto; justify-content: flex-end; }
        }

        @media (max-width: 768px) {
            header { padding: 12px 15px; }
            .logo-area h1 { font-size: 18px; }
            .logo-image { height: 40px; }
            .theme-toggle { width: 35px; height: 35px; margin-right: 10px; }
            main { margin: 20px auto; padding: 0 10px; }
            .search-bar { width: calc(100% - 10px); }
            .skill-card { padding: 15px; }
            .skill-header { flex-direction: column; align-items: stretch; gap: 12px; }
            .skill-title-group { width: 100%; text-align: right; }
            .skill-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .github-stats { grid-column: 1 / -1; justify-content: center; padding: 10px; font-size: 14px; }
            .btn { padding: 10px 5px; font-size: 12px; width: 100%; }
            .btn-github { grid-column: 1 / -1; }
            pre { font-size: 12px; padding: 12px; }
            footer { padding: 20px 15px; font-size: 13.5px; }
        }
    </style>
</head>

        // نظام الوضع الداكن (Dark Mode)
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('moonIcon').style.display = 'none';
                document.getElementById('sunIcon').style.display = 'block';
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                document.getElementById('moonIcon').style.display = 'block';
                document.getElementById('sunIcon').style.display = 'none';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                document.getElementById('moonIcon').style.display = 'none';
                document.getElementById('sunIcon').style.display = 'block';
            }
        }

                githubUrl: "https://github.com/anthropics/financial-services",
                filename: "3-statement-model.md",
                codeContent: `إكمال نموذج مالي من 3 قوائم
قم بإكمال وتعبئة نماذج القوائم المالية المتكاملة مع التأكد من الربط الصحيح بين قائمة الدخل (Income Statement)، والميزانية العمومية (Balance Sheet)، وقائمة التدفقات النقدية (Cash Flow Statement).

⚠️ مبادئ أساسية وحرجة — اقرأ قبل تعبئة أي نموذج

بيئة العمل — Office JS مقابل Python
- إذا كنت تعمل داخل Excel (إضافة Office / Office JS): استخدم Office JS مباشرة. اكتب المعادلات عبر range.formulas = [["=D14*(1+Assumptions!$B$5)"]] — لا تستخدم أبداً range.values للخلايا المستنتجة أو المحسوبة. لا حاجة لإعادة الحساب بشكل منفصل؛ Excel يقوم بذلك تلقائياً.
- تنبيه حول الخلايا المدمجة: لا تقم باستدعاء .merge() ثم تعيين .values على النطاق المدمج. اكتب القيمة في الخلية العلوية اليسرى فقط، ثم قم بدمج وتنسيق النطاق.
- إذا كنت تنشئ ملف .xlsx مستقل: استخدم Python/openpyxl. اكتب نصوص المعادلات، ثم قم بتشغيل recalc.py قبل التسليم.

المعادلات بدلاً من القيم الثابتة (Hardcodes) (غير قابلة للنقاش)
- كل خلية توقعات (projection)، أو ترحيل (roll-forward)، أو ربط، أو إجمالي فرعي يجب أن تكون معادلة Excel — لا تكن أبداً قيمة محسوبة مسبقاً.
- الخلايا الوحيدة التي تقبل أرقاماً ثابتة هي: (1) البيانات التاريخية الفعلية، (2) مدخلات الافتراضات (Assumptions).
- السبب: يجب أن يكون النموذج مرناً عند تغيير السيناريوهات أو الافتراضات.

التحقق خطوة بخطوة مع المستخدم
1. خريطة النموذج: اعرض الأوراق التي حددتها وتأكد من المستخدم قبل التعديل.
​2. البيانات التاريخية: اعرض الكتلة التاريخية وتأكد من مطابقتها للمصدر.
3. قائمة الدخل (IS): اعرض الإجماليات الفرعية وقائمة الدخل المتوقعة وتأكد قبل الميزانية.
4. الميزانية العمومية (BS): اعرض فحص التوازن (الأصول = الخصوم + حقوق الملكية) وتأكد قبل التدفقات.
5. التدفقات النقدية (CF): اعرض مطابقة النقد (نقد التدفقات = نقد الميزانية) وتأكد قبل الإنهاء.
- لا تملأ النموذج كاملاً دفعة واحدة! توقف عند كل خطوة واعرض العمل لاكتشاف الأخطاء مبكراً.

التنسيق — الألوان والخطوط
استخدم تدرجات الأزرق والرمادي فقط:
- رؤوس الأقسام: أزرق داكن #1F4E79 / خط أبيض عريض.
- رؤوس الأعمدة: أزرق فاتح #D9E1F2 / خط أسود عريض.
- خلايا الإدخال: تعبئة رمادي فاتح / خط أزرق (للدلالة على أنها مدخلات).
- خلايا المعادلات: تعبئة بيضاء / خط أسود.
- الروابط بين الأوراق (Links): تعبئة بيضاء / خط أخضر.

هيكل النموذج والتحقق (Integrity Checks)
قبل إنهاء العمل، يجب أن تتأكد من صحة هذه المعادلات المحورية:
- توازن الميزانية: الأصول - الخصوم - حقوق الملكية = 0
- مطابقة النقدية: النقد الختامي في CF - النقد في BS = 0
- تطابق صافي الدخل: صافي الدخل في IS - صافي الدخل الافتتاحي في CF = 0
- الأرباح المبقاة (Retained Earnings): الرصيد السابق + صافي الدخل - التوزيعات = الرصيد الختامي في BS.
- التمويل بحقوق الملكية (Equity Financing): التغير في الأسهم العادية في BS - إصدار الأسهم في CF = 0`
            },

                filename: "ui-ux-pro-max.md",
                codeContent: `مهارة: UI/UX Pro Max

هذه المهارة تمنحك قدرات هندسة التصميم لبناء واجهات مستخدم احترافية وتجارب مستخدم متقدمة.

⚠️ مبادئ التصميم والتنفيذ الأساسية

1. نظام التصميم (Design System) أولاً
- لا تبدأ ببناء عناصر واجهة عشوائية. ابدأ دائماً بإنشاء أو اتباع نظام تصميم موحد (Design System).
- حافظ على اتساق الألوان (Colors)، الخطوط (Typography)، المسافات (Spacing)، وحالات التفاعل (Interaction States) عبر جميع المكونات.
- عند التعديل على تطبيق قائم، قم بتحليل واستخدام نظام التصميم الحالي بدلاً من اختراع نظام موازٍ.

2. أفضل ممارسات UI/UX
- التباين وسهولة الوصول (Accessibility): تأكد من وجود تباين لوني كافٍ وتوفير تسميات (Aria labels) للأزرار والأيقونات.
- التجاوب (Responsiveness): يجب أن تعمل التصاميم بشكل مثالي على الهواتف، الأجهزة اللوحية، والشاشات الكبيرة.
- الحالات المختلفة (States): لا تنسَ تصميم حالات: التحويم (Hover)، التركيز (Focus)، النشط (Active)، المعطل (Disabled)، والخطأ (Error).

3. التطبيق العملي وكتابة الكود
- اكتب كوداً نظيفاً وقابلاً لإعادة الاستخدام (Reusable Components).
- تجنب القيم الثابتة (Hardcoded values) واستخدم المتغيرات (CSS Variables / Tailwind Classes) قدر الإمكان.
- إذا كنت تستخدم إطارات عمل مثل React أو Tailwind، اتبع اصطلاحات التسمية وأفضل الممارسات الخاصة بها.

خطوات العمل عند طلب تصميم أو تعديل واجهة
1. التحليل والاستكشاف: افهم متطلبات المشروع، نوع المنتج (SaaS, E-commerce, Fintech...)، والمكتبات المستخدمة حالياً.
​2. تحديد الهوية البصرية: اختر الألوان والخطوط المناسبة لنوع المنتج (مثلاً: أزرق للثقة في البنوك، ألوان حيوية للتطبيقات الإبداعية).
3. التنفيذ خطوة بخطوة: ابدأ بالهيكل الأساسي (Layout)، ثم المكونات الكبيرة، ثم التفاصيل الدقيقة (Micro-interactions).
4. المراجعة (Pre-delivery checks): تأكد من عدم وجود أخطاء UX شائعة، وتحقق من تناسق التصميم مع الوضعين الفاتح والداكن (Light/Dark mode) إذا طُلب ذلك.`
            },

                codeContent: `# مهارة إنشاء سجل الإنجازات (Brag Document)

- الاتساق البصري (Consistency): استخدم أشكالاً، ألواناً، وأحجاماً متسقة لتمثيل العناصر المتشابهة (مثال: كل قواعد البيانات بشكل أسطواني ولون أزرق، كل الخدمات بصندوق رمادي).

## ⚠️ مبادئ أساسية (لا تتجاوزها):

- الأتمتة والفعالية (Automation & Efficiency): ابحث دائمًا عن طرق لتقليل التدخل اليدوي. إذا كانت المهمة تتكرر، فيجب أن تُعالج باستخدام سكريبت، اختصار (Shortcut)، أو أداة مساعدة.
- قوة سطر الأوامر (CLI Power): شجع على استخدام سطر الأوامر وأدوات الـ Terminal القوية (مثل grep, awk, jq, وغيرها) لأنها توفر سرعة ومرونة لا تضاهى في معالجة البيانات وإدارة الأنظمة.
- التعلم المستمر وتوسيع المدارك: لا تكتفِ بإعطاء الحل النهائي فقط. اشرح باختصار "كيف" تعمل الأداة أو الأمر، لتمكين المستخدم من استخدام هذه المعرفة في مواقف مستقبلية مشابهة.

## منهجية العمل (خطوة بخطوة):

1. تشخيص عنق الزجاجة (Bottleneck):
   - افهم المهمة الروتينية أو البطيئة التي يعاني منها المستخدم.
   - ابحث عن الأنماط المتكررة في عمله التي يمكن تسريعها.

تُستخدم هذه المهارة لمساعدة المستخدمين في إعداد، كتابة، وتحسين اختبارات واجهات الويب الآلية (E2E Testing) باستخدام إطار عمل Playwright (والمفاهيم المتعلقة ببروتوكول MCP إن وجدت في سياق المشروع).

## ⚠️ مبادئ أساسية (لا تتجاوزها):

- الموثوقية (Reliability): اختبارات الواجهات يجب ألا تكون هشة (Flaky). اعتمد على محددات (Locators) قوية ومرنة، وتجنب الاعتماد التام على بنية الـ DOM الثابتة (مثل XPath المعقد أو الكلاسات التي تتغير باستمرار). الأفضل استخدام المحددات المعتمدة على سهولة الوصول (Accessibility-based locators مثل getByRole أو getByText).
- العزل والمستقلية: كل اختبار يجب أن يكون مستقلاً تمامًا عن الآخر. لا ينبغي لاختبار أن يعتمد على نتيجة اختبار سابق. استخدم ميزات Playwright (مثل سياقات المتصفح Browser Contexts) لضمان بيئة نظيفة لكل اختبار.
- الأداء والسرعة: اكتب اختبارات تنفذ المهام بفعالية. تجنب الانتظار الثابت (مثال: waitForTimeout(5000)) واستخدم بدلاً من ذلك آليات الانتظار التلقائي (Auto-waiting) القوية المدمجة في Playwright والتي تنتظر ظهور العناصر أو اكتمال طلبات الشبكة.

## منهجية العمل (خطوة بخطوة):

1. تحديد السيناريو:
   - اسأل المستخدم عن مسار الاستخدام (User Flow) الذي يريد اختباره خطوة بخطوة.
   - ما هي النتيجة المتوقعة (Assertion) التي تثبت نجاح الاختبار؟

2. اختيار المحددات (Locators):
   - اقترح أو اكتب الكود باستخدام محددات Playwright المُوصى بها (مثال: page.getByRole('button', { name: 'Submit' })).
   - تجنب استخدام المحددات الهشة واشرح للمستخدم سبب اختيار المحدد الأفضل.

   - استخدم دوال التحقق المدمجة والقوية مثل expect(locator).toBeVisible().

4. التعامل مع الحالات المتقدمة (إن لزم الأمر):
   - قدم حلولاً للتعامل مع اعتراض طلبات الشبكة (Network Mocking/Interception)، رفع الملفات، أو التعامل مع النوافذ المتعددة، مستفيدًا من ميزات Playwright المتقدمة.

- هل الكود يُختبر بشكل معزول وبطريقة واضحة ومقروءة؟`

                });
            });
        }

        function copyGithubLink(btn, link) {
            const textArea = document.createElement("textarea");
            textArea.value = link;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                const originalText = btn.innerHTML;
                btn.innerHTML = "تم ✔";
                btn.style.backgroundColor = "#4CAF50"; 
                btn.style.borderColor = "#4CAF50";
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.backgroundColor = "";
                    btn.style.borderColor = "";
                }, 2000);
            } catch (err) {}
            document.body.removeChild(textArea);
        }

        function downloadContent(index) {
            const skill = skillsData[index];
            const blob = new Blob([skill.codeContent], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = skill.filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSkills();

            const searchInput = document.getElementById('searchInput');
            if(searchInput) {
                searchInput.addEventListener('keyup', (e) => {
                    const filter = e.target.value.toLowerCase();
                    const cards = document.querySelectorAll('.skill-card');
                    cards.forEach(card => {
                        const title = card.querySelector('.skill-title').innerText.toLowerCase();
                        card.style.display = title.includes(filter) ? "" : "none";
                    });
                });
            }
        });
    </script>
</body>
</html>
