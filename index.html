<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArClaudeSkills</title>
    <style>
        :root {
            --primary: #C15F3C;
            --bg: #F4F3EE;
            --card-bg: #FFFFFF;
            --border-color: #B1ADA1;
            --text-main: #222;
            --text-muted: #555;
        }
        
        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-main);
        }

        /* 
         * تحسين الهيدر: 
         * - تقليل الـ padding لتقليل الفراغ.
         * - ضبط الارتفاع ليكون متناسق ومريح للعين.
         */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px; 
            background-color: var(--card-bg);
            border-bottom: 3px solid var(--border-color);
            position: sticky; /* يثبت الهيدر فوق يعطي تجربة أفضل */
            top: 0;
            z-index: 100;
        }
        
        .logo-area { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }
        .logo-area h1 { 
            margin: 0; 
            color: var(--primary); 
            font-size: 22px; /* تصغير بسيط ليتناسق مع الهيدر النحيف */
        }
        
        /* ضبط اللوقو عشان ما يسبب فراغ عمودي كبير */
        .logo-image { 
            height: 55px; /* ارتفاع ثابت يحمي الهيدر من التمدد */
            width: auto;
            object-fit: contain;
        }

        /* 
         * تحسين الحاوية الأساسية:
         * - تقليل الـ margin العلوي اللي كان مسبب "الفراغ القاتل".
         */
        main { 
            max-width: 900px; /* تصغير بسيط لعرض المحتوى لزيادة التركيز */
            margin: 30px auto; 
            padding: 0 20px; 
        }
        
        /* شريط البحث */
        .search-container { 
            margin-bottom: 30px; /* تقليل المسافة بين البحث والبطاقات */
            text-align: center; 
        }
        .search-bar {
            width: 100%;
            max-width: 600px;
            padding: 14px 20px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 3px 3px 0px var(--border-color); /* تخفيف الظل ليكون أنعم */
            outline: none;
            transition: all 0.2s ease;
        }
        .search-bar:focus { 
            border-color: var(--primary);
            box-shadow: 3px 3px 0px var(--primary); 
        }

        .skills-grid { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; /* تقليل الفراغ بين البطاقات */
        }

        /* البطاقات */
        .skill-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color); /* تنحيف الإطار */
            box-shadow: 4px 4px 0px var(--border-color);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            overflow: hidden;
        }
        .skill-card:active { 
            transform: translate(2px, 2px); 
            box-shadow: 2px 2px 0px var(--border-color); 
        }
        
        .skill-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .skill-title-group { flex: 1; min-width: 250px; }
        .skill-title-group h3 { 
            margin: 0 0 4px 0; 
            color: var(--text-main); 
            font-size: 17px;
        }
        .skill-title-group p { 
            margin: 0; 
            color: var(--text-muted); 
            font-size: 13px;
            line-height: 1.4;
        }
        
        .skill-actions { 
            display: flex; 
            gap: 8px; /* تقليل الفراغ بين الأزرار */
            align-items: center; 
        }
        
        /* إحصائيات قيت هب */
        .github-stats {
            background-color: rgba(177, 173, 161, 0.15); /* تفتيح اللون ليكون أنعم */
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: bold;
        }
        .github-stats svg { width: 14px; height: 14px; fill: currentColor; }

        /* الأزرار */
        .btn {
            padding: 8px 14px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn svg { width: 14px; height: 14px; fill: currentColor; }
        
        .btn-copy { background-color: var(--primary); color: white; border-color: var(--primary); }
        .btn-copy:hover { background-color: #a85132; border-color: #a85132; }
        
        .btn-download { background-color: white; color: var(--text-main); }
        .btn-download:hover { background-color: var(--bg); }
        
        .btn-github { background-color: #24292e; color: white; border-color: #24292e; }
        .btn-github:hover { background-color: #1b1f23; border-color: #1b1f23; }

        /* تفاصيل البطاقة */
        .skill-details {
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.4s ease, margin-top 0.4s ease;
        }
        .skill-card.active .skill-details {
            max-height: 5000px;
            opacity: 1;
            margin-top: 15px; /* تقليل الفراغ الداخلي */
            border-top: 1px dashed var(--border-color); /* خط أنحف */
            padding-top: 15px;
        }

        pre {
            background-color: #2b2b2b;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            direction: rtl;
            text-align: right;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13.5px;
            line-height: 1.5;
            white-space: pre-wrap;
            margin: 0; /* منع الفراغ الإضافي تحت الكود */
        }
        .loading-text { color: #888; font-style: italic; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>ArClaudeSkills</h1>
        </div>
        <img src="logo.png" alt="ArClaudeSkills Logo" class="logo-image">
    </header>

    <main>
        <div class="search-container">
            <input type="text" class="search-bar" id="searchInput" placeholder="ابحث عن مهارة...">
        </div>

        <div class="skills-grid" id="skillsGrid"></div>
    </main>

    <script>
        // ==========================================
        // بيانات المهارات
        // ==========================================
        const skillsData = [
            {
                title: "نموذج القوائم المالية الثلاث (3-Statement Model)",
                author: "بواسطة Anthropic",
                description: "إكمال وتعبئة نماذج مالية من 3 قوائم مع الربط الكامل.",
                githubUrl: "https://github.com/anthropics/financial-services",
                filename: "3-statement-model.md",
                rawFileUrl: "", 
                codeContent: `إكمال نموذج مالي من 3 قوائم
قم بإكمال وتعبئة نماذج النماذج المالية المتكاملة مع التأكد من الربط الصحيح بين قائمة الدخل، الميزانية العمومية، وقائمة التدفقات النقدية.

⚠️ مبادئ حرجة — اقرأ قبل تعبئة أي نموذج
بيئة العمل — Office JS مقابل Python:
- إذا كنت تعمل داخل Excel (إضافة Office / Office JS): استخدم Office JS مباشرة.
- إذا كنت تنشئ ملف .xlsx مستقل: استخدم Python/openpyxl.

المعادلات على القيم الثابتة (غير قابلة للنقاش):
- كل خلية توقعات يجب أن تكون معادلة Excel.

تحقق خطوة بخطوة مع المستخدم:
1. بعد مطابقة القالب ← اعرض للمستخدم الأوراق وأكدها قبل التعديل.
2. بعد تعبئة البيانات التاريخية ← اعرض الكتلة التاريخية وأكد تطابقها.
3. بعد بناء توقعات الدخل ← شغل فحوصات الإجماليات الفرعية.
4. بعد بناء الميزانية ← اعرض فحص التوازن.
5. بعد بناء التدفقات النقدية ← اعرض مطابقة النقد.`
            },
            {
                title: "UI/UX Pro Max",
                author: "بواسطة NextLevelBuilder",
                description: "مهندس تصميم UI/UX متقدم لبناء واجهات احترافية عبر مختلف المنصات.",
                githubUrl: "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill",
                filename: "ui-ux-pro-max.md",
                rawFileUrl: "https://raw.githubusercontent.com/nextlevelbuilder/ui-ux-pro-max-skill/main/CLAUDE.md",
                codeContent: ""
            }
        ];

        // ==========================================
        // دوال النظام
        // ==========================================

        function renderSkills() {
            const grid = document.getElementById('skillsGrid');
            grid.innerHTML = skillsData.map((skill, index) => `
                <div class="skill-card">
                    <div class="skill-header">
                        <div class="skill-title-group">
                            <h3 class="skill-title">${skill.title}</h3>
                            <p>${skill.author}: ${skill.description}</p>
                        </div>
                        <div class="skill-actions">
                            <div class="github-stats" title="عدد النجوم في قيت هب">
                                <svg viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"></path></svg>
                                <span id="stars-count-${index}">...</span>
                            </div>
                            
                            <button class="btn btn-copy" onclick="event.stopPropagation(); copyGithubLink(this, '${skill.githubUrl}')">نسخ الرابط</button>
                            <button class="btn btn-download" onclick="event.stopPropagation(); downloadContent(${index})">تحميل</button>
                            <a href="${skill.githubUrl}" target="_blank" class="btn btn-github" onclick="event.stopPropagation();">
                                <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg>
                                GitHub
                            </a>
                        </div>
                    </div>
                    <div class="skill-details">
                        <div class="code-block">
                            <pre><code id="code-content-${index}">${skill.rawFileUrl ? '<span class="loading-text">جاري سحب المهارة من قيت هب...</span>' : skill.codeContent}</code></pre>
                        </div>
                    </div>
                </div>
            `).join('');

            attachCardListeners();
            fetchGitHubStars();
            fetchRawFiles();
        }

        function fetchGitHubStars() {
            skillsData.forEach((skill, index) => {
                const match = skill.githubUrl.match(/github\.com\/([^\/]+)\/([^\/]+)/);
                if (match) {
                    const owner = match[1];
                    const repo = match[2];
                    fetch(`https://api.github.com/repos/${owner}/${repo}`)
                        .then(response => response.json())
                        .then(data => {
                            if (data.stargazers_count !== undefined) {
                                let stars = data.stargazers_count;
                                if (stars >= 1000) stars = (stars / 1000).toFixed(1) + 'k';
                                document.getElementById(`stars-count-${index}`).innerText = stars;
                            }
                        })
                        .catch(() => document.getElementById(`stars-count-${index}`).innerText = "N/A");
                }
            });
        }

        function fetchRawFiles() {
            skillsData.forEach((skill, index) => {
                if (skill.rawFileUrl) {
                    fetch(skill.rawFileUrl)
                        .then(response => response.text())
                        .then(text => {
                            document.getElementById(`code-content-${index}`).innerText = text;
                            skill.codeContent = text; 
                        })
                        .catch(() => {
                            document.getElementById(`code-content-${index}`).innerText = "فشل تحميل المهارة من الرابط المباشر.";
                        });
                }
            });
        }

        function attachCardListeners() {
            document.querySelectorAll('.skill-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.btn')) return;
                    card.classList.toggle('active');
                });
            });
        }

        function copyGithubLink(btn, link) {
            const textArea = document.createElement("textarea");
            textArea.value = link;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                const originalText = btn.innerHTML;
                btn.innerHTML = "تم ✔";
                btn.style.backgroundColor = "#4CAF50"; 
                btn.style.borderColor = "#4CAF50";
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.backgroundColor = "";
                    btn.style.borderColor = "";
                }, 2000);
            } catch (err) {}
            document.body.removeChild(textArea);
        }

        function downloadContent(index) {
            const skill = skillsData[index];
            const blob = new Blob([skill.codeContent], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = skill.filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSkills();

            const searchInput = document.getElementById('searchInput');
            if(searchInput) {
                searchInput.addEventListener('keyup', (e) => {
                    const filter = e.target.value.toLowerCase();
                    const cards = document.querySelectorAll('.skill-card');
                    cards.forEach(card => {
                        const title = card.querySelector('.skill-title').innerText.toLowerCase();
                        card.style.display = title.includes(filter) ? "" : "none";
                    });
                });
            }
        });
    </script>
</body>
</html>
