<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كلاود كود - مهارات سريعة</title>
    <style>
        :root {
            --primary: #C15F3C;
            --bg: #F4F3EE;
            --card-bg: #FFFFFF;
            --border-color: #B1ADA1;
            --text-main: #222;
            --text-muted: #555;
        }
        
        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-main);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: var(--card-bg);
            border-bottom: 3px solid var(--border-color);
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-area img { width: 50px; height: 50px; image-rendering: pixelated; }
        .logo-area h1 { margin: 0; color: var(--primary); font-size: 24px; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--border-color); object-fit: cover; background-color: white;}

        main { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        .search-container { margin-bottom: 40px; text-align: center; }
        .search-bar {
            width: 100%;
            max-width: 600px;
            padding: 15px 20px;
            font-size: 18px;
            border: 3px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 4px 4px 0px var(--border-color);
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar:focus { border-color: var(--primary); }

        .skills-grid { display: flex; flex-direction: column; gap: 20px; }

        .skill-card {
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            box-shadow: 5px 5px 0px var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.1s;
            overflow: hidden;
        }
        .skill-card:active { 
            transform: translate(2px, 2px); 
            box-shadow: 3px 3px 0px var(--border-color); 
        }
        
        .skill-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .skill-title-group { flex: 1; min-width: 250px; }
        .skill-title-group h3 { margin: 0 0 5px 0; color: var(--text-main); font-size: 18px;}
        .skill-title-group p { margin: 0; color: var(--text-muted); font-size: 14px; }
        
        .skill-actions { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
        }
        
        .github-stats {
            background-color: rgba(177, 173, 161, 0.25);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: bold;
        }
        .github-stats svg { width: 16px; height: 16px; fill: currentColor; }

        .btn {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn svg { width: 16px; height: 16px; fill: currentColor; }
        
        .btn-copy { background-color: var(--primary); color: white; border-color: var(--primary); }
        .btn-copy:hover { opacity: 0.9; }
        
        .btn-download { background-color: white; color: var(--text-main); }
        .btn-download:hover { background-color: var(--bg); }
        
        .btn-github { background-color: #24292e; color: white; border-color: #24292e; }
        .btn-github:hover { opacity: 0.9; }

        .skill-details {
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.4s ease, margin-top 0.4s ease;
        }
        .skill-card.active .skill-details {
            max-height: 5000px;
            opacity: 1;
            margin-top: 20px;
            border-top: 2px dashed var(--border-color);
            padding-top: 20px;
        }

        pre {
            background-color: #2b2b2b;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            direction: rtl;
            text-align: right;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="image_de347a.png" alt="Cloud Icon">
            <h1>كلاود كود</h1>
        </div>
        <!-- تم ربط صورتك المبكسلة المرفقة هنا -->
        <img src="Editing_pixel-art_character_image_2K_20261025083443-removebg-preview.png" alt="Abdullah Avatar" class="avatar">
    </header>

    <main>
        <div class="search-container">
            <input type="text" class="search-bar" id="searchInput" placeholder="ابحث عن مهارة...">
        </div>

        <!-- الحاوية التي سيتم إضافة المهارات داخلها برمجياً -->
        <div class="skills-grid" id="skillsGrid"></div>
    </main>

    <script>
        // ==========================================
        // 🚀 منطقة إضافة المهارات (أضف المهارات الجديدة هنا)
        // ==========================================
        const skillsData = [
            {
                title: "نموذج القوائم المالية الثلاث (3-Statement Model)",
                author: "بواسطة Anthropic",
                description: "إكمال وتعبئة نماذج مالية من 3 قوائم مع الربط الكامل.",
                stars: "1.2k",
                githubUrl: "https://github.com/anthropics/financial-services",
                filename: "3-statement-model.md",
                codeContent: `إكمال نموذج مالي من 3 قوائم
قم بإكمال وتعبئة نماذج النماذج المالية المتكاملة مع التأكد من الربط الصحيح بين قائمة الدخل، الميزانية العمومية، وقائمة التدفقات النقدية.

⚠️ مبادئ حرجة — اقرأ قبل تعبئة أي نموذج
بيئة العمل — Office JS مقابل Python:
- إذا كنت تعمل داخل Excel (إضافة Office / Office JS): استخدم Office JS مباشرة. اكتب المعادلات عبر range.formulas = [["=D14*(1+Assumptions!$B$5)"]] — لا تستخدم أبدًا range.values للخلايا المستنتجة. لا توجد إعادة حساب منفصلة؛ Excel يحسبها محليًا.
- إذا كنت تنشئ ملف .xlsx مستقل: استخدم Python/openpyxl. اكتب نصوص المعادلات (ws["D15"] = "=D14*(1+Assumptions!$B$5)")، ثم قم بتشغيل recalc.py قبل التسليم.

المعادلات على القيم الثابتة (غير قابلة للنقاش):
- كل خلية توقعات، أو ترحيل، أو ربط، أو إجمالي فرعي يجب أن تكون معادلة Excel — أبدًا لا تكون قيمة محسوبة مسبقًا.
- الخلايا الوحيدة التي يجب أن تحتوي على أرقام ثابتة هي: (1) البيانات التاريخية الفعلية، (2) مدخلات الافتراضات في ورقة الافتراضات.

تحقق خطوة بخطوة مع المستخدم:
1. بعد مطابقة القالب ← اعرض للمستخدم الأوراق وأكدها قبل التعديل.
2. بعد تعبئة البيانات التاريخية ← اعرض الكتلة التاريخية وأكد تطابقها.
3. بعد بناء توقعات الدخل ← شغل فحوصات الإجماليات الفرعية.
4. بعد بناء الميزانية ← اعرض فحص التوازن (الأصول = الخصوم + حقوق الملكية).
5. بعد بناء التدفقات النقدية ← اعرض مطابقة النقد.`
            }
            // يمكنك نسخ البلوك السابق ولصقه هنا لإضافة مهارة جديدة مع تغيير البيانات
        ];

        // ==========================================
        // ⚙️ دوال النظام (لا تحتاج لتعديلها)
        // ==========================================

        function renderSkills() {
            const grid = document.getElementById('skillsGrid');
            grid.innerHTML = skillsData.map((skill, index) => `
                <div class="skill-card">
                    <div class="skill-header">
                        <div class="skill-title-group">
                            <h3 class="skill-title">${skill.title}</h3>
                            <p>${skill.author}: ${skill.description}</p>
                        </div>
                        <div class="skill-actions">
                            <div class="github-stats" title="عدد النجوم في قيت هب">
                                <svg viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"></path></svg>
                                <span>${skill.stars}</span>
                            </div>
                            
                            <!-- تم تعديل دالة النسخ لتأخذ رابط قيت هب مباشرة -->
                            <button class="btn btn-copy" onclick="event.stopPropagation(); copyGithubLink(this, '${skill.githubUrl}')">نسخ الرابط</button>
                            <button class="btn btn-download" onclick="event.stopPropagation(); downloadContent(${index})">تحميل</button>
                            <a href="${skill.githubUrl}" target="_blank" class="btn btn-github" onclick="event.stopPropagation();">
                                <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg>
                                GitHub
                            </a>
                        </div>
                    </div>
                    <div class="skill-details">
                        <div class="code-block">
                            <pre><code>${skill.codeContent}</code></pre>
                        </div>
                    </div>
                </div>
            `).join('');

            attachCardListeners();
        }

        function attachCardListeners() {
            document.querySelectorAll('.skill-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.btn')) return;
                    card.classList.toggle('active');
                });
            });
        }

        function copyGithubLink(btn, link) {
            const textArea = document.createElement("textarea");
            textArea.value = link;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                const originalText = btn.innerHTML;
                btn.innerHTML = "تم ✔";
                btn.style.backgroundColor = "#4CAF50"; 
                btn.style.borderColor = "#4CAF50";
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.backgroundColor = "";
                    btn.style.borderColor = "";
                }, 2000);
            } catch (err) {
                console.error('فشل النسخ: ', err);
            }
            document.body.removeChild(textArea);
        }

        function downloadContent(index) {
            const skill = skillsData[index];
            const blob = new Blob([skill.codeContent], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.href = url;
            a.download = skill.filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSkills();

            const searchInput = document.getElementById('searchInput');
            if(searchInput) {
                searchInput.addEventListener('keyup', (e) => {
                    const filter = e.target.value.toLowerCase();
                    const cards = document.querySelectorAll('.skill-card');
                    cards.forEach(card => {
                        const title = card.querySelector('.skill-title').innerText.toLowerCase();
                        card.style.display = title.includes(filter) ? "" : "none";
                    });
                });
            }
        });
    </script>
</body>
</html>
